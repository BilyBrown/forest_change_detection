[project]
name = "harvest"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bily", email = "bilyhasemail@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "folium>=0.20.0",
    "geopandas>=1.2.0",
    "mapclassify>=2.10.0",
    "matplotlib>=3.11.2",
    "numpy>=1.21.6",
    "odc>=0.1.4.2",
    "odc-stac>=0.5.3",
    "pystac-client>=0.5.1",
    "rioxarray>=0.9.1",
    "xarray>=0.20.2",
]

[project.scripts]
harvest = "harvest:main"

[build-system]
requires = ["uv_build>=0.11.22,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.16.2",
    "jupyterlab>=3.6.8",
    "pytest>=7.4.4",
]
